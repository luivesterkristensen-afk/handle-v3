<!DOCTYPE html>
<html lang="da">
<head>
  <!-- Grundlæggende metadata til mobilvisning -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#176b4d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Handleliste">
  <title>Handleliste</title>

  <!-- Appens minimalistiske design -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-full-bleed.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-full-bleed.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Enkel topbjælke med titel og synkroniseringsstatus -->
  <header class="topbar">
    <h1>Handleliste</h1>
    <div class="sync-status" id="syncStatus" aria-live="polite">
      <span class="sync-dot"></span>
      <span>Forbinder</span>
    </div>
  </header>

  <main class="app-shell">
    <!-- Søgning i det indbyggede produktkatalog -->
    <section class="product-search" aria-labelledby="searchHeading">
      <h2 id="searchHeading" class="sr-only">Find en vare</h2>
      <div class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="productSearch" type="search" placeholder="Søg blandt 1.000 varer" autocomplete="off">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Ryd søgning" hidden>×</button>
      </div>
      <div id="searchResults" class="search-results" hidden></div>
    </section>

    <!-- Overskrift og tæller for den fælles handleliste -->
    <section class="list-header">
      <div>
        <p class="section-label">FÆLLES LISTE</p>
        <h2>Varer</h2>
      </div>
      <p id="itemCount" class="item-count">0 varer</p>
    </section>

    <!-- Her indsættes varerne opdelt efter afdeling -->
    <section id="shoppingList" class="shopping-list" aria-live="polite"></section>
    <button id="clearList" class="clear-list-button" type="button" hidden>Tøm liste</button>

    <!-- Vises når handlelisten er tom -->
    <section id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">✓</div>
      <h2>Listen er tom</h2>
      <p>Søg efter en vare ovenfor.</p>
    </section>
  </main>

  <!-- Flydende knap til varer, som ikke findes i kataloget -->
  <button id="openCustomModal" class="floating-button" type="button" aria-label="Opret ny vare">+</button>

  <!-- Enkel lokal adgangskode til handlelisten -->
  <dialog id="accessModal" class="modal access-modal">
    <form id="accessForm" class="modal-card">
      <p class="section-label">PRIVAT LISTE</p>
      <h2>Indtast adgangskode</h2>
      <p class="modal-subtitle">Skriv koden for at åbne handlelisten.</p>

      <div class="field">
        <label for="accessPassword">Adgangskode</label>
        <input id="accessPassword" type="password" autocomplete="current-password" required>
      </div>

      <p id="accessError" class="access-error" role="alert" hidden>Forkert adgangskode. Prøv igen.</p>
      <button class="primary-button" type="submit">Åbn handlelisten</button>
    </form>
  </dialog>

  <!-- Dialog til oprettelse af en vare, der mangler -->
  <dialog id="customModal" class="modal">
    <form id="customForm" method="dialog" class="modal-card">
      <button class="modal-close" type="button" data-close="customModal" aria-label="Luk">×</button>
      <p class="section-label">NY VARE</p>
      <h2>Tilføj manglende vare</h2>

      <div class="field">
        <label for="customName">Varenavn</label>
        <input id="customName" type="text" maxlength="80" placeholder="Fx havremælk" required>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="customCategory">Afdeling</label>
          <select id="customCategory" required></select>
        </div>
      </div>

      <button class="primary-button" type="submit">Gem og tilføj</button>
    </form>
  </dialog>

  <!-- Kort besked nederst på skærmen -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Appens funktioner -->
  <script type="module" src="app.js"></script>
</body>
</html>
